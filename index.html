  <!-- Splash: the wordmark writes itself in (outline draws, a slanted brush paints the ink, the crescent lands on the i).
       main.js plays it once fonts are ready, then removes it; CSS hides it after 4.5 s even if scripts fail. -->
  <div id="splash" class="splash" aria-hidden="true">
    <svg class="splash-mark" viewBox="0 0 640 220" focusable="false">
      <defs>
        <linearGradient id="sp-brush" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".9" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <mask id="sp-ink" maskUnits="userSpaceOnUse" x="-200" y="0" width="1040" height="220"><rect class="sp-sweep" x="-1000" y="-20" width="1000" height="260" fill="url(#sp-brush)"/></mask>
        <filter id="sp-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <text class="sp-outline" x="320" y="142" text-anchor="middle">n&#x131;ghtout</text>
      <text class="sp-fill" x="320" y="142" text-anchor="middle" mask="url(#sp-ink)">n&#x131;ghtout</text>
      <circle class="sp-nib" cx="-50" cy="108" r="4.5" filter="url(#sp-glow)"/>
      <g class="sp-moon" transform="translate(236 46)"><g class="sp-moon-in" filter="url(#sp-glow)"><path d="M12.6 1.2a9 9 0 1 0 6.2 14.6A7.6 7.6 0 0 1 12.6 1.2Z" transform="scale(2.3) translate(-10 -10)"/></g></g>
    </svg>
    <p class="splash-tag">Tonight in New Brunswick</p>
  </div>
